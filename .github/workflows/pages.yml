# Builds the Next.js site in web/ as static files and publishes it to
# GitHub Pages: https://samchinmaya.github.io/komp
name: Website

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /komp
          TURBO_TELEMETRY_DISABLED: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v4
