<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>комп brand</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#0F1419; --paper:#F6F7F9; --muted:#6B7684; --signal:#3EE08F; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-monospace, Menlo, monospace; background:var(--paper); color:var(--ink); }
  main { max-width:880px; margin:0 auto; padding:32px 16px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:32px 0 12px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .card { flex:1 1 300px; border-radius:12px; padding:32px; display:flex; align-items:center; justify-content:center; min-height:160px; }
  .light { background:#fff; border:1px solid #E3E6EA; }
  .dark { background:var(--ink); }
  .sizes { display:flex; gap:24px; align-items:flex-end; }
  .sizes figure { margin:0; text-align:center; font-size:11px; color:var(--muted); }
  .tab { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid #E3E6EA; border-radius:8px 8px 0 0; padding:8px 14px; }
  .tab.d { background:#202124; color:#E8EAED; border-color:#202124; }
  .sw { display:flex; gap:12px; flex-wrap:wrap; }
  .sw div { width:120px; }
  .sw span { display:block; height:48px; border-radius:8px; border:1px solid #E3E6EA; }
  .pix { image-rendering:pixelated; }
</style>
</head>
